name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scanner
          POSTGRES_PASSWORD: scanner
          POSTGRES_DB: scanner_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scanner" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://scanner:scanner@localhost:5432/scanner_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply to an empty database and match models
        run: DATABASE_URL=$TEST_DATABASE_URL python -m alembic upgrade head && DATABASE_URL=$TEST_DATABASE_URL python -m alembic check
      - name: Unit and API tests (SQLite, scripted model)
        run: python -m pytest
      - name: PostgreSQL-specific tests
        run: python -m pytest -m postgres
      - name: Full suite on PostgreSQL
        run: USE_TEST_POSTGRES=1 python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
