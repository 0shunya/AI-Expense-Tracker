[project]
name = "ai-expense-scanner"
version = "1.0.0"
description = "Multimodal receipt extraction with schema validation, deterministic financial checks, human review and evaluation."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "SQLAlchemy==2.1.6",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.6",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "python-multipart==0.0.32",
  "google-genai==2.33.0",
  "pillow==13.0.0",
  "pypdfium2==5.14.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not live and not postgres'"
markers = [
  "live: calls the real Gemini API (needs GEMINI_API_KEY and quota); run with -m live",
  "postgres: needs TEST_DATABASE_URL pointing at a disposable PostgreSQL database; run with -m postgres",
]
